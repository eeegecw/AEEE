<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0f0d">
<meta name="description" content="Thank you for contacting the AEEE committee at Government Engineering College Wayanad.">
<title>Thank You | AEEE GEC Wayanad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f0d;--lime:#c5f65a;--cream:#f0efe9}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--cream);font-family:"DM Sans",sans-serif;display:flex;align-items:center;justify-content:center;padding:48px 22px;overflow-x:hidden}
.thankyou{width:100%;max-width:850px;text-align:center;display:flex;align-items:center;flex-direction:column}
.success-mark{width:105px;height:105px;border-radius:50%;background:var(--lime);display:grid;place-items:center;margin:0 auto 39px;color:#0d0f0d}
.success-mark svg{width:49px;height:49px;display:block}
.kicker{font-size:15px;font-weight:800;letter-spacing:.34em;color:var(--lime);margin:0 0 32px}
h1{font-size:clamp(44px,7vw,78px);line-height:1.12;letter-spacing:-.055em;font-weight:700;margin:0;color:var(--cream)}
h1 span{display:block;color:var(--lime)}
.rule{width:82px;height:4px;background:var(--lime);margin:48px auto 48px}
.message{font-size:19px;line-height:2.05;color:#c8c8c1;margin:0}
.signature{font-size:13px;letter-spacing:.17em;color:#77796f;margin:78px 0 40px;font-weight:500}
.home-link{min-height:54px;padding:0 25px;border:1px solid #3b3e34;color:var(--cream);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:9px;font-size:12px;font-weight:800;letter-spacing:.1em;transition:background .2s ease,border-color .2s ease,color .2s ease}
.home-link:hover{background:var(--lime);border-color:var(--lime);color:#10120e}
@media(max-width:600px){body{padding:36px 20px}.success-mark{width:86px;height:86px;margin-bottom:32px}.success-mark svg{width:41px;height:41px}.kicker{font-size:11px;letter-spacing:.27em;margin-bottom:26px}h1{font-size:clamp(39px,10vw,58px)}.rule{margin:36px auto}.message{font-size:15px;line-height:1.9}.signature{font-size:10px;line-height:1.8;margin:60px 0 32px;letter-spacing:.13em}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="thankyou">
  <div class="success-mark" aria-label="Success">
    <svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M9 24.5 19.2 34 39 12.5" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <p class="kicker">AEEE · GEC WAYANAD</p>
  <h1>Thank You for <span>Your Submission.</span></h1>
  <div class="rule" aria-hidden="true"></div>
  <p class="message">Your message has been received successfully.<br>Thank you for reaching out to the AEEE committee.<br>We'll be in touch with you soon.</p>
  <p class="signature">ASSOCIATION OF ELECTRICAL &amp; ELECTRONICS ENGINEERS</p>
  <a class="home-link" href="index.html">BACK TO HOME <span aria-hidden="true">↗</span></a>
</main>
</body>
</html>
